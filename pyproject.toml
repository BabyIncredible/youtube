[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-automation"
version = "0.1.0"
description = "Resumable faceless YouTube video production pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6.0,<7"]
media = ["Pillow>=11.0,<12"]
youtube = [
    "google-api-python-client>=2.160,<3",
    "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
youtube-automation = "youtube_automation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_automation"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]